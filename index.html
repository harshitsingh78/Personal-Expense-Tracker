<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>💰 Expense Tracker Dashboard</h2>
        
        <!-- Balance Display -->
        <div class="balance-container">
            <h4>Your Balance</h4>
            <h1 id="balance">₹0.00</h1>
        </div>

        <!-- Income/Expense Summary -->
        <div class="inc-exp-container">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money plus">+₹0.00</p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money minus">-₹0.00</p>
            </div>
        </div>

        <!-- History / List -->
        <h3>History</h3>
        <ul id="list" class="list">
            <!-- Items will be added here via JavaScript -->
        </ul>

        <!-- Add New Transaction Form -->
        <h3>Add New Transaction</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Description (e.g., Salary, Book, Food)</label>
                <input type="text" id="text" placeholder="Enter text..." required />
            </div>
            <div class="form-control">
                <label for="amount">Amount <br> (negative = expense, positive = income)</label>
                <input type="number" id="amount" placeholder="Enter amount..." required />
            </div>
            <button class="btn">Add Transaction</button>
        </form>
        
        <!-- Clear All Button -->
        <button id="clear-btn" class="btn" style="background-color: #7f8c8d; margin-top: 10px;">Clear All Data</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
