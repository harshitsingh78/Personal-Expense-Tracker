<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="floating-container">
        <span class="float-item fill-1">💵</span>
        <span class="float-item fill-2">📈</span>
        <span class="float-item fill-3">🪙</span>
        <span class="float-item fill-4">👛</span>
        <span class="float-item fill-5">💳</span>
        <span class="float-item fill-6">📊</span>
        <span class="float-item fill-7">💰</span>
        <span class="float-item fill-8">📉</span>
    </div>

    <div class="container">
        
        <div class="auth-container" id="auth-box">
            <div class="login-card">
                <div class="app-icon">💰</div>
                <h2>Personal Expense Tracker</h2>
                <p class="tagline">Manage your daily expenses with a clean, secure and automated dashboard.</p>
                <button id="login-btn" class="google-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
                    <span>Sign in with Google</span>
                </button>
            </div>
        </div>

        <div class="user-profile-bar" id="user-profile" style="display: none;">
            <span id="user-name"></span>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
        
        <div id="main-dashboard" style="display: none;">
            
            <h2>💰 Expense Tracker Dashboard</h2>

            <div class="balance-container">
                <h4>Your Balance</h4>
                <h1 id="balance">₹0.00</h1>
            </div>

            <div class="inc-exp-container">
                <div>
                    <h4>Income</h4>
                    <p id="money-plus" class="money plus">+₹0.00</p>
                </div>
                <div>
                    <h4>Expense</h4>
                    <p id="money-minus" class="money minus">-₹0.00</p>
                </div>
            </div>

            <h3>History</h3>
            <ul id="list" class="list">
                </ul>

            <h3>Add New Transaction</h3>
            <form id="form">
                <div class="form-control">
                    <label for="text">Description (e.g., Salary, Book, Food)</label>
                    <input type="text" id="text" placeholder="Enter text..." required />
                </div>
                <div class="form-control">
                    <label for="amount">Amount <br> (negative = expense, positive = income)</label>
                    <input type="number" id="amount" placeholder="Enter amount..." required />
                </div>
                <button class="btn">Add Transaction</button>
            </form>
            
            <button id="clear-btn" class="btn" style="background-color: #7f8c8d; margin-top: 20px;">Clear My Data</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
